version: 2

# Dependency update PRs — keeps NuGet packages and GitHub Actions
# pinned versions current.

updates:
  - package-ecosystem: "nuget"
    directory: "/src/AudioCarousel"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "nuget"
    directory: "/tests/AudioCarousel.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(test)"

  # Bumps the SDK pinned in global.json. The self-contained exe bundles the
  # runtime, so runtime security fixes only reach users through a rebuild.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
